<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>김진우를 위한 카카오뱅크 — 솔루션 프로토타입</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.min.css">
<style>
:root{
  --kb-yellow:#FEE500;
  --event:#FFE24A; --saving:#586071; --living:#B7E0DB; --ibk:#E6EBEF;
  --teal:#A8D9D3;
  --ink:#2B2E33; --ink2:#46494E; --sub:#8C9298; --sub2:#B6BBC2; --line:#F1F1F2;
  --bg:#F2F4F6; --red:#F8454C; --blue:#4C7DF0; --green:#16C09A;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;
  font-family:'Pretendard','Apple SD Gothic Neo',sans-serif}
body{background:#0E1116;display:flex;align-items:center;justify-content:center;gap:36px;
  min-height:100vh;padding:26px;color:var(--ink)}
.stage{position:fixed;top:20px;left:26px;color:#596069;font-size:13px;line-height:1.7}
.stage b{display:block;color:#C9CED6;font-size:15px}
svg{display:block}
.ic{width:24px;height:24px;display:inline-block;vertical-align:middle}

/* ===== 폰 프레임 ===== */
.frame{width:390px;height:802px;background:#fff;border-radius:46px;overflow:hidden;
  position:relative;box-shadow:0 32px 90px rgba(0,0,0,.6);border:10px solid #000}

/* iOS 상태바 */
.sb{height:38px;display:flex;align-items:center;justify-content:space-between;
  padding:10px 24px 0;position:relative;z-index:30;pointer-events:none;color:#111}
.sb .t{font-size:14px;font-weight:700;letter-spacing:.2px}
.sb .r{display:flex;align-items:center;gap:6px}
.sb svg{display:block}
.homebar{position:absolute;bottom:9px;left:50%;transform:translateX(-50%);
  width:138px;height:5px;border-radius:3px;background:#0A0A0A;z-index:45}

/* ===== 화면 공통 ===== */
.screen{position:absolute;inset:0;display:none;flex-direction:column;background:#fff;z-index:10}
.screen.on{display:flex;animation:fade .22s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
.body{flex:1;overflow-y:auto;scrollbar-width:none}
.body::-webkit-scrollbar{display:none}
.iconbtn{border:none;background:none;cursor:pointer;color:inherit;padding:8px;display:flex;align-items:center;justify-content:center}
.iconbtn .ic{width:25px;height:25px}

/* 하단 탭바 */
.tabbar{height:62px;display:flex;align-items:center;border-top:1px solid #F4F4F4;background:#fff;z-index:20}
.tabbar button{flex:1;border:none;background:none;cursor:pointer;color:#C5C9CF;
  display:flex;align-items:center;justify-content:center;position:relative}
.tabbar button .ic{width:26px;height:26px}
.tabbar button.active{color:#2B2E33}
.tabbar .reddot{position:absolute;top:13px;left:calc(50% + 6px);width:6px;height:6px;border-radius:50%;background:var(--red)}

.toast{position:absolute;left:50%;bottom:96px;transform:translateX(-50%) translateY(16px);
  background:rgba(20,20,22,.92);color:#fff;padding:12px 20px;border-radius:24px;font-size:14px;
  font-weight:600;opacity:0;pointer-events:none;transition:.25s;z-index:60;white-space:nowrap}
.toast.show{opacity:1;transform:translateX(-50%)}

/* 아바타(계좌 성격 글리프) */
.ava{border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;overflow:hidden}
.ava svg{width:58%;height:58%}

/* ===== 패턴 잠금 (Image 6) ===== */
#s-pattern{background:var(--kb-yellow)}
#s-pattern .body{display:flex;flex-direction:column;align-items:center;overflow:hidden;touch-action:none;overscroll-behavior:none}
.deer{margin-top:40px}
.pt-title{margin-top:30px;font-size:21px;font-weight:700;color:#1A1A1A}
.pt-sub{margin-top:11px;font-size:15px;color:#F0612C;font-weight:600}
.pattern{margin-top:46px;position:relative;touch-action:none}
.pattern svg.lines{position:absolute;inset:0;pointer-events:none}
.pgrid{display:grid;grid-template-columns:repeat(3,76px);grid-gap:38px}
.pdot{width:76px;height:76px;display:flex;align-items:center;justify-content:center}
.pdot i{width:17px;height:17px;border-radius:50%;background:#1B1B1B;transition:.15s}
.pdot.act i{transform:scale(1.55);background:#000}
.pt-forgot{margin-top:auto;margin-bottom:32px;font-size:14px;color:#6A6440;text-decoration:underline}

/* ===== 홈 (Image 7) ===== */
#s-home{background:var(--bg)}
.home-top{display:flex;align-items:center;gap:8px;padding:4px 22px 16px}
.home-top h1{font-size:25px;font-weight:800;letter-spacing:-.3px}
.home-top .myacc{font-size:14px;color:var(--sub);font-weight:600}
.home-top .prof{margin-left:auto;width:38px;height:38px;border-radius:50%;
  background:linear-gradient(135deg,#8FB7C9,#5E7E8F);display:flex;align-items:center;justify-content:center}
.home-top .prof svg{width:22px;height:22px;color:#fff}
.banner{margin:0 16px 20px;background:#fff;border-radius:18px;padding:16px 18px;
  display:flex;align-items:center;gap:12px;box-shadow:0 2px 12px rgba(0,0,0,.045)}
.banner .bt{flex:1;font-size:12.5px;line-height:1.55;color:#9298A0}
.banner .bt b{display:block;color:var(--ink);font-size:14px;font-weight:700;margin-top:3px}
.banner .bi{width:42px;height:42px;flex-shrink:0}
.acct{margin:0 16px 13px;border-radius:22px;padding:18px 20px 16px;position:relative;
  box-shadow:0 4px 16px rgba(0,0,0,.055);cursor:pointer;transition:transform .12s}
.acct:active{transform:scale(.985)}
.acct .more{position:absolute;top:18px;right:18px;display:flex;gap:3px}
.acct .more b{width:4px;height:4px;border-radius:50%;background:currentColor;opacity:.4}
.acct .nm{display:flex;align-items:center;gap:9px;font-size:15px;font-weight:700}
.acct .nm .ava{width:30px;height:30px}
.acct .nm .star{color:#F5A623;font-size:14px;margin-left:-2px}
.acct .amt{font-size:27px;font-weight:700;margin-top:13px;letter-spacing:-.4px}
.acct .btns{display:flex;gap:8px;margin-top:14px}
.acct .btns span{background:rgba(0,0,0,.055);padding:8px 17px;border-radius:13px;font-size:13.5px;font-weight:700}
.acct.c-event{background:var(--event);color:#2B2614}
.acct.c-saving{background:var(--saving);color:#fff}
.acct.c-saving .btns span{background:rgba(255,255,255,.16)}
.acct.c-living{background:var(--living);color:#1C3B38}
.acct.c-ibk{background:var(--ibk);color:#2B2E33}

/* ===== 상품/예적금 (Image 8) ===== */
.ptabs{display:flex;gap:20px;padding:10px 22px 12px;overflow-x:auto;font-size:16px;font-weight:600;color:#B7BCC2;border-bottom:1px solid #F4F4F4}
.ptabs::-webkit-scrollbar{display:none}
.ptabs span{white-space:nowrap;padding-bottom:2px}
.ptabs span.on{color:var(--ink);font-weight:800}
.prod{display:flex;align-items:center;padding:19px 22px;border-bottom:1px solid #F5F5F5}
.prod .pl{flex:1}
.prod .pl .nm{font-size:16.5px;font-weight:700;display:flex;align-items:center;gap:7px}
.prod .pl .nm .best{font-size:10px;font-weight:800;background:#FFF0D2;color:#E89400;padding:2px 7px;border-radius:6px}
.prod .pl .d{font-size:13.5px;color:var(--sub);margin-top:6px}
.prod .pr{text-align:right;flex-shrink:0;margin-left:14px}
.prod .pr .rate{font-size:16.5px;font-weight:800;color:var(--green)}
.prod .pr .per{font-size:12px;color:var(--sub2);margin-top:4px}

/* ===== 계좌 상세 (Image 9/10) ===== */
#s-detail{background:#fff;--db:var(--teal);--df:#173F3B}
#det-sb{background:var(--db)}
.det-top{display:flex;align-items:center;padding:2px 12px;background:var(--db);color:var(--df)}
.det-top h1{flex:1;text-align:center;font-size:17px;font-weight:700}
.det-top .ri{display:flex}
.det-head{background:var(--db);color:var(--df);padding:4px 24px 28px}
.det-head .accno{font-size:13px;opacity:.62;display:flex;align-items:center;gap:5px;font-weight:600}
.det-head .accno svg{width:14px;height:14px;flex-shrink:0}
.det-head .total{font-size:31px;font-weight:800;margin-top:11px;letter-spacing:-.5px}
.det-head .ppl{display:flex;margin-top:16px}
.det-head .ppl .ava{width:36px;height:36px;border:2.5px solid var(--db);margin-right:-10px}
.det-head .rule{display:inline-flex;align-items:center;gap:3px;margin-top:16px;background:#fff;color:#2B2E33;
  border-radius:19px;padding:9px 16px;font-size:13px;font-weight:700;box-shadow:0 2px 8px rgba(0,0,0,.08);white-space:nowrap}
.det-head .rule svg{width:15px;height:15px;flex-shrink:0}
.det-filter{display:flex;align-items:center;padding:16px 22px 10px;background:#fff}
.det-filter .srch{color:#9DA2A8}
.det-filter .opt{margin-left:auto;font-size:13px;color:var(--sub);font-weight:600;display:flex;align-items:center;gap:3px;white-space:nowrap;flex-shrink:0}
.det-filter .opt svg{width:15px;height:15px;flex-shrink:0}
.txrow{display:flex;align-items:flex-start;padding:15px 22px;gap:14px}
.txrow .dt{width:38px;font-size:13px;color:var(--sub);padding-top:2px;font-weight:500}
.txrow .mid{flex:1}
.txrow .mid b{font-size:15.5px;font-weight:600}
.txrow .mid span{display:block;font-size:13px;color:var(--sub);margin-top:4px}
.txrow .rt{text-align:right}
.txrow .rt .v{font-size:15.5px;font-weight:700}
.txrow .rt .v.plus{color:var(--blue)}
.txrow .rt .bal{font-size:12.5px;color:var(--sub2);margin-top:4px;font-weight:500}
.det-float{position:absolute;right:18px;bottom:82px;background:#CCE6F1;color:#3A82AC;
  border:none;border-radius:24px;padding:11px 17px 11px 13px;font-size:14px;font-weight:700;cursor:pointer;
  box-shadow:0 8px 20px rgba(58,130,172,.25);display:flex;align-items:center;gap:6px;z-index:15}
.det-float .wc{width:20px;height:20px;border-radius:50%;background:#3A82AC;color:#CCE6F1;
  display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800}

/* ===== 내 계좌 모아보기 (Image 3) ===== */
#s-myacc{background:var(--bg)}
.ma-top{display:flex;align-items:center;padding:2px 14px}
.ma-title{font-size:23px;font-weight:800;padding:8px 22px 16px;letter-spacing:-.3px}
.ma-pills{display:flex;gap:8px;padding:0 22px 18px}
.ma-pills span{padding:9px 17px;border-radius:20px;font-size:14px;font-weight:700;background:#E8EBEE;color:#80868E}
.ma-pills span.on{background:var(--ink);color:#fff}
.ma-total{margin:0 16px 16px;background:#E8EBEE;border-radius:14px;padding:15px 18px;
  display:flex;justify-content:space-between;font-size:15px;font-weight:700}
.ma-card{margin:0 16px 12px;background:#fff;border-radius:18px;padding:18px 20px;
  display:flex;align-items:center;cursor:pointer;box-shadow:0 2px 10px rgba(0,0,0,.04);transition:transform .12s}
.ma-card:active{transform:scale(.985)}
.ma-card .ava{width:42px;height:42px;margin-right:14px}
.ma-card .l b{font-size:16px;font-weight:700}
.ma-card .l span{display:block;font-size:12.5px;color:var(--sub);margin-top:4px}
.ma-card .r{margin-left:auto;font-size:16px;font-weight:800;display:flex;align-items:center;gap:7px}
.ma-card .r .ar{color:#CDD1D6}
.ma-sub{font-size:13.5px;font-weight:700;color:var(--sub);padding:12px 22px 12px}
.ma-link{display:flex;align-items:center;justify-content:center;gap:4px;font-size:14px;color:var(--sub);margin:24px auto;cursor:pointer}
.ma-link u{text-decoration:underline}

/* ===== 이체 받는사람 (Image 5) ===== */
.rc-top{display:flex;align-items:center;padding:8px 20px 8px}
.rc-top h1{font-size:22px;font-weight:800;flex:1;letter-spacing:-.3px}
.rc-top .close{font-size:15px;color:var(--sub);font-weight:600;cursor:pointer}
.rc-search{margin:8px 20px 16px;background:#F2F4F6;border-radius:13px;padding:14px 16px;
  display:flex;align-items:center;gap:10px;color:#A6ABB1;font-size:15px}
.rc-search svg{color:#A6ABB1}
.rc-tabs{display:flex;gap:8px;padding:0 20px 14px;border-bottom:1px solid #F2F2F2}
.rc-tabs span{font-size:15px;font-weight:700;color:#AEB3B9;padding:7px 15px;border-radius:18px;cursor:pointer}
.rc-tabs span.on{background:#EEF0F2;color:var(--ink)}
.rc-sec{display:flex;align-items:center;padding:20px 22px 8px;font-size:15px;font-weight:700}
.rc-sec .cnt{margin-left:auto;font-size:13px;color:var(--sub);font-weight:600;display:flex;align-items:center;gap:3px}
.rc-row{display:flex;align-items:center;gap:14px;padding:13px 22px;cursor:pointer}
.rc-row:active{background:#FAFAFA}
.rc-row .ava{width:46px;height:46px}
.rc-row .info b{font-size:16px;font-weight:600;display:block}
.rc-row .info span{font-size:13px;color:var(--sub)}
.rc-row .star{margin-left:auto;color:#D5D8DC;cursor:pointer}
.rc-bottom{border-top:1px solid #F2F2F2;padding:18px 22px;font-size:15px;font-weight:700;
  text-align:center;background:#fff;display:flex;align-items:center;justify-content:center;gap:6px}
.rc-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;padding:0 18px 8px}
.rc-big{display:flex;flex-direction:column;align-items:center;gap:6px;border:1.5px solid #ECEDEF;background:#FAFBFC;
  border-radius:20px;padding:18px 10px 16px;min-height:112px;cursor:pointer;font-family:inherit;transition:.15s}
.rc-big:active{transform:scale(.97)}
.rc-big .ini{width:44px;height:44px;border-radius:50%;color:#fff;font-size:18px;font-weight:800;
  display:flex;align-items:center;justify-content:center}
.rc-big b{font-size:16.5px;font-weight:800;color:#2B2E33}
.rc-big .bk{font-size:12.5px;color:#8C9298}
.rc-sec2{padding:14px 22px 10px;font-size:13.5px;font-weight:700;color:#8C9298}

/* ===== 송금 금액 (Image 1/2) ===== */
.am-top{display:flex;align-items:center;padding:4px 16px}
.am-top h1{flex:1;text-align:center;font-size:17px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:4px}
.am-top h1 svg{width:14px;height:14px;color:#9DA2A8}
.am-top .cancel{font-size:15px;color:var(--sub);font-weight:600;cursor:pointer}
.am-sub{text-align:center;font-size:13px;color:var(--sub);margin-top:0}
.am-amount{text-align:center;margin:52px 0 0;font-size:44px;font-weight:800;color:#1E2124;min-height:54px;letter-spacing:-.5px;transition:color .15s}
.am-amount.lack{color:var(--red)}
.am-amount.empty{color:#D6D9DE;font-weight:600;font-size:30px}
.am-hint{text-align:center;font-size:13.5px;color:var(--sub);margin-top:14px;min-height:18px}
.am-hint.lack{color:var(--red);font-weight:600}
.am-hint.lack u{color:var(--red)}
.am-hint u{cursor:pointer}
.am-ext{margin:44px 22px 0;background:#F2F4F6;border:none;border-radius:12px;padding:17px 18px;
  display:flex;align-items:center;justify-content:space-between;font-size:14px;color:#6B7077}
.am-ext svg{width:18px;height:18px;color:#9DA2A8;flex-shrink:0}
.am-keypad{margin-top:auto;display:grid;grid-template-columns:repeat(3,1fr);padding:8px 12px 0}
.am-key{height:60px;border:none;background:none;font-size:25px;font-weight:600;cursor:pointer;
  display:flex;align-items:center;justify-content:center;color:var(--ink);transition:background .1s;margin:2px;border-radius:14px}
.am-key svg{width:24px;height:24px}
.am-key:active{background:#F3F3F3}
.am-next{margin:12px 16px 16px;height:54px;border:none;border-radius:14px;background:#F1F2F4;
  color:#B7BBC1;font-size:16.5px;font-weight:700;cursor:pointer;transition:.2s}
.am-next.on{background:var(--kb-yellow);color:#2B2614}

/* ===== 오픈뱅킹 동의 (Image 4) ===== */
.ob-top{display:flex;align-items:center;padding:4px 16px}
.ob-top h1{flex:1;text-align:center;font-size:16px;font-weight:700}
.ob-top .cancel{font-size:15px;color:var(--sub);cursor:pointer}
.ob-head{padding:20px 24px 24px;font-size:20px;font-weight:700;line-height:1.45;letter-spacing:-.3px}
.ob-card{margin:0 18px;background:#fff;border:1px solid #F0F0F0;border-radius:18px;
  box-shadow:0 5px 20px rgba(0,0,0,.05);overflow:hidden}
.ob-all{display:flex;align-items:center;gap:12px;padding:18px 20px;font-size:16px;font-weight:700;cursor:pointer}
.ob-all .ck{width:26px;height:26px;border-radius:50%;background:var(--kb-yellow);display:flex;align-items:center;justify-content:center;color:#2B2614}
.ob-all .ck svg{width:15px;height:15px}
.ob-all .ar{margin-left:auto;color:#C7CBD0}
.ob-item{display:flex;align-items:center;gap:13px;padding:13px 20px;font-size:14px;color:#5E646E;border-top:1px solid #F4F4F4}
.ob-item .ck{color:#2B2E33;display:flex}
.ob-item .ck svg{width:17px;height:17px}
.ob-item .ar{margin-left:auto;color:#D7DADE}
.ob-agree{margin:auto 16px 22px;height:56px;border:none;border-radius:14px;background:var(--kb-yellow);
  color:#2B2614;font-size:17px;font-weight:800;cursor:pointer}

/* ===== 한 줄 + 말줄임 처리(박스 초과 방지) ===== */
.acct .nm{min-width:0}
.acct .nm .nmtxt{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.acct .nm .ava,.acct .nm .star{flex-shrink:0}
.det-top h1{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 4px;min-width:0}
.det-head .accno{min-width:0;white-space:nowrap;overflow:hidden}
.rc-row .info{flex:1;min-width:0}
.rc-row .info b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rc-row .ava,.rc-row .star{flex-shrink:0}
.ma-card .l{flex:1;min-width:0}
.ma-card .l b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.ma-card .ava{flex-shrink:0}
.ma-card .r{flex-shrink:0;white-space:nowrap}
.ob-item{min-width:0}
.ob-item .t{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ob-item .ck,.ob-item .ar{flex-shrink:0}
.am-top h1{min-width:0}
.am-top h1 .nmtxt{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.am-top h1 svg{flex-shrink:0}
.prod .pl{min-width:0}
.prod .pl .nm{min-width:0}
.prod .pl .nm .best{flex-shrink:0}
.prod .pl .d{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.banner .bt b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

@media (max-width:760px){
  body{padding:0;gap:0;background:#fff}
  .stage{display:none}
  .frame{width:100vw;height:100dvh;border-radius:0;border:none;box-shadow:none}
}

/* ===== 신형 홈 (실사용 스크린샷 반영) ===== */
.h2-top{display:flex;align-items:center;padding:10px 22px 6px}
.h2-top h1{font-size:24px;font-weight:800;letter-spacing:-.3px}
.h2-top .bell{position:relative;color:#2B2E33}
.h2-top .bell .ic{width:26px;height:26px}
.h2-top .bell::after{content:'';position:absolute;top:1px;right:1px;width:7px;height:7px;border-radius:50%;background:var(--red);border:1.5px solid var(--bg)}
.h2-bubble{margin:6px auto 14px;display:flex;align-items:center;gap:7px;background:#fff;border-radius:26px;
  padding:13px 20px;font-size:14.5px;font-weight:700;box-shadow:0 3px 14px rgba(0,0,0,.06);width:fit-content}
.h2-bubble svg{width:18px;height:18px;flex-shrink:0}
.h2-ad{margin:0 16px 16px;background:#fff;border-radius:18px;padding:16px 18px;position:relative;
  display:flex;align-items:center;gap:10px;box-shadow:0 2px 10px rgba(0,0,0,.04)}
.h2-ad .l{flex:1;min-width:0}
.h2-ad .l .s1{font-size:13px;color:#6E747B}
.h2-ad .l .s2{font-size:16.5px;font-weight:800;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

(function(){
  const grid=$('#pattern'),svg=$('#plines');let drawing=false,seq=[];
  const C=[38,152,266];const ctr=i=>({x:C[i%3],y:C[Math.floor(i/3)]});
  function draw(){svg.innerHTML=seq.slice(1).map((p,k)=>{const a=ctr(seq[k]),b=ctr(p);
    return `<line x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}" stroke="#1B1B1B" stroke-width="6" stroke-linecap="round"/>`;}).join('');}
  function add(el){const p=+el.dataset.p;if(seq.includes(p))return;seq.push(p);el.classList.add('act');draw();navigator.vibrate&&navigator.vibrate(9);}
  function hit(e){const t=e.touches?e.touches[0]:e;const el=document.elementFromPoint(t.clientX,t.clientY);const d=el&&el.closest('.pdot');if(d)add(d);}
  grid.addEventListener('pointerdown',e=>{e.preventDefault();
    if(e.target.setPointerCapture)try{e.target.releasePointerCapture(e.pointerId);}catch(_){}
    drawing=true;seq=[];$$('.pdot').forEach(d=>d.classList.remove('act'));svg.innerHTML='';hit(e);});
  grid.addEventListener('pointermove',e=>{if(drawing){e.preventDefault();hit(e);}});
  grid.addEventListener('touchmove',e=>{if(drawing)e.preventDefault();},{passive:false});
  const endPat=()=>{if(!drawing)return;drawing=false;
    if(seq.length>=4)setTimeout(()=>{go('authsel');entrySuccess();},180);else{$$('.pdot').forEach(d=>d.classList.remove('act'));svg.innerHTML='';seq=[];}};
  window.addEventListener('pointerup',endPat);window.addEventListener('pointercancel',endPat);window.addEventListener('touchend',endPat);
})();

(function(){
  const grid=$('#au-grid'),svg=$('#au-lines');let drawing=false,seq=[];
  const C=[29,117,205];const ctr=i=>({x:C[i%3],y:C[Math.floor(i/3)]});
  function draw(){svg.innerHTML=seq.slice(1).map((p,k)=>{const a=ctr(seq[k]),b=ctr(p);
    return `<line x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}" stroke="#2B2E33" stroke-width="5" stroke-linecap="round"/>`;}).join('');}
  function add(el){const p=+el.dataset.p;if(seq.includes(p))return;seq.push(p);el.classList.add('act');draw();navigator.vibrate&&navigator.vibrate(8);}
  function hit(e){const t=e.touches?e.touches[0]:e;const el=document.elementFromPoint(t.clientX,t.clientY);const d=el&&el.closest('.au-dot');if(d)add(d);}
  grid.addEventListener('pointerdown',e=>{e.preventDefault();drawing=true;seq=[];
    $$('#au-grid .au-dot').forEach(d=>d.classList.remove('act'));svg.innerHTML='';hit(e);});
  grid.addEventListener('pointermove',e=>{if(drawing){e.preventDefault();hit(e);}});
  grid.addEventListener('touchmove',e=>{if(drawing)e.preventDefault();},{passive:false});
  const end=()=>{if(!drawing)return;drawing=false;
    if(seq.length>=4)authSuccess();
    else{$$('#au-grid .au-dot').forEach(d=>d.classList.remove('act'));svg.innerHTML='';seq=[];}};
  window.addEventListener('pointerup',end);window.addEventListener('touchend',end);
})();

const aiMock=[
  [/교통/, '이번달 후불교통대금은 47,250원이에요.\n다음달 5일에 김진우의 통장에서 자동 출금될 예정이에요. 🚌'],
  [/지원금|고유가/, '2차 고유가 피해지원금은 6월 30일까지 정부24에서 신청할 수 있어요.\n대상 여부는 차량 등록 정보로 자동 확인되고, 지급까지 약 2주 걸려요.'],
  [/점심|4만/, '근로자 점심값 지원은 월 최대 4만 원까지 식대 캐시백 형태로 제공돼요.\n카카오뱅크 체크카드로 평일 11~14시 결제 시 자동 적용돼요. 🍱'],
  [/10만|후회/, '같은 10만 원이라면 이렇게 나눠보는 건 어때요?\n· 5만 원: 세이프박스 (비상금)\n· 3만 원: 26주적금 도전\n· 2만 원: 나를 위한 소비\n작게 나누면 후회가 줄어요.'],
  [/연금|1억/, '1억 원을 연 4%로 운용하며 20년간 나눠 받으면 매달 약 60만 원 정도 받을 수 있어요.\n(세전 단순 계산 기준이에요)'],
  [/이체/, '이수민(4271)님에게 이체를 시작할게요.\n받는 분 정보를 확인했어요 → 이체 화면으로 이동할까요?', 'transfer'],
];
function aiReply(q){
  for(const [re,ans,act] of aiMock){if(re.test(q))return [ans,act];}
  return ['지금은 데모 버전이라 간단한 질문만 답할 수 있어요.\n아래 추천 질문을 눌러보세요! 😊',null];
}
function aiSend(q){
  if(!q.trim())return;
  const s=$('#s-ai'),m=$('#ai-msgs');
  s.classList.add('chatting');
  m.insertAdjacentHTML('beforeend',`<div class="msg me">${q}</div>`);
  const [ans,act]=aiReply(q);

    m.insertAdjacentHTML('beforeend',`<div class="msg ai"><span class="sp">${I.spark.replace('viewBox','class="sp" viewBox')}</span>${ans}</div>`);

function haptic(ms=10){
  navigator.vibrate&&navigator.vibrate(ms);
  const f=$('#frame');f.classList.remove('hpulse');void f.offsetWidth;f.classList.add('hpulse');
}
function koAmount(n){
  n=+n;if(!n)return'';
  const dig=['','일','이','삼','사','오','육','칠','팔','구'];
  const small=v=>{let s='';const th=v/1000|0,h=v%1000/100|0,te=v%100/10|0,o=v%10;
    if(th)s+=(th>1?dig[th]:'')+'천';if(h)s+=(h>1?dig[h]:'')+'백';
    if(te)s+=(te>1?dig[te]:'')+'십';if(o)s+=dig[o];return s;};
  let out='',rest=n;
  for(const[u,val]of[['조',1e12],['억',1e8],['만',1e4]]){
    const q=rest/val|0;if(q){out+=(q===1?'':small(q))+u;rest%=val;}
  }
  if(rest)out+=small(rest);
  return out+' 원';
}
function maskName(n){return n.length<2?n:n[0]+'●'+n.slice(2);}

/* ===== SOLUTION: 슬라이드 투 센드 ===== */
(function(){
  const sl=$('#slide'),knob=$('#sl-knob'),fill=$('#sl-fill');
  let drag=false,sx=0,px=0,max=1;
  function resetSlide(){knob.style.transform='';fill.style.width='';sl.classList.remove('hot','drag');px=0;}
  knob.addEventListener('pointerdown',e=>{
    drag=true;sx=e.clientX;max=Math.max(1,sl.clientWidth-62);sl.classList.add('drag');
    knob.setPointerCapture(e.pointerId);
  });
  knob.addEventListener('pointermove',e=>{
    if(!drag)return;
    px=Math.max(0,Math.min(max,e.clientX-sx));
    knob.style.transform=`translateX(${px}px)`;
    fill.style.width=(px+62)+'px';
    sl.classList.toggle('hot',px/max>.55);
  });
  knob.addEventListener('pointerup',()=>{
    if(!drag)return;drag=false;
    if(px/max>=.92){
      haptic(50);
      const bf=$('#burstfx');bf.classList.remove('go');void bf.offsetWidth;bf.classList.add('go');
      $('#cf-dim').classList.remove('on');$('#cf-sheet').classList.remove('on');
      resetSlide();resetAuth2();go('auth2');
    }else{
      sl.classList.remove('drag');
      resetSlide();
    }
  });
  knob.addEventListener('pointercancel',()=>{
    if(drag){drag=false;sl.classList.remove('drag');resetSlide();}
  });
})();
